<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nebula — Dashboard</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="hero">
    <canvas id="stars"></canvas>
    <div class="hero-card">
      <div class="hero-mark">NEBULA</div>
      <h1>Configure ton bot depuis un seul endroit.</h1>
      <p>Bienvenue, réglages de modération, économie, niveaux et plus encore — tout se règle ici, sans taper une seule commande.</p>
      <a class="btn-discord" href="/auth/login">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.078.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.6 12.6 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.073.073 0 0 1 .078.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.04.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.029 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.673-3.549-13.662a.06.06 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.211 0 2.176 1.094 2.157 2.418 0 1.334-.955 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.21 0 2.176 1.094 2.157 2.418 0 1.334-.946 2.419-2.157 2.419z"/></svg>
        Se connecter avec Discord
      </a>
      <div id="error" class="hero-error" style="display:none;"></div>
    </div>
  </div>

  <script>
    // Starfield discret
    const c = document.getElementById('stars');
    const ctx = c.getContext('2d');
    function resize() { c.width = window.innerWidth; c.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);
    const stars = Array.from({ length: 140 }, () => ({
      x: Math.random() * c.width,
      y: Math.random() * c.height,
      r: Math.random() * 1.3 + 0.2,
      s: Math.random() * 0.015 + 0.003,
      p: Math.random() * Math.PI * 2,
    }));
    function draw() {
      ctx.clearRect(0, 0, c.width, c.height);
      const grad = ctx.createRadialGradient(c.width*0.7, c.height*0.3, 0, c.width*0.7, c.height*0.3, c.width*0.7);
      grad.addColorStop(0, 'rgba(139,92,246,0.10)');
      grad.addColorStop(1, 'rgba(139,92,246,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, c.width, c.height);
      for (const st of stars) {
        st.p += st.s;
        const alpha = 0.35 + Math.sin(st.p) * 0.35;
        ctx.beginPath();
        ctx.fillStyle = `rgba(237,234,246,${Math.max(0, alpha)})`;
        ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    draw();

    const params = new URLSearchParams(location.search);
    const err = params.get('error');
    if (err) {
      const messages = {
        missing_code: "La connexion Discord a échoué. Réessaie.",
        not_in_server: "Tu dois être membre du serveur pour accéder au dashboard.",
        no_permission: "Tu dois avoir la permission « Gérer le serveur » pour accéder au dashboard.",
        auth_failed: "La connexion a échoué. Réessaie dans un instant.",
      };
      const box = document.getElementById('error');
      box.textContent = messages[err] || "Une erreur est survenue.";
      box.style.display = 'block';
    }
  </script>
</body>
</html>
